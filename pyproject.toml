[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "repomentor"
version = "0.1.0"
description = "RepoMentor Debug Gym: practice repository-based debugging interviews locally."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
# The harness itself is standard library only. pytest runs inside each
# challenge's own venv (it comes from the challenge lock file).
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
repomentor = "repomentor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: end-to-end tests that create venvs and may need network"]
addopts = "-m 'not slow'"
